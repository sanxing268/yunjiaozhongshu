# ==============================
# 应用配置模板（复制为 application.yaml 后填入真实值）
# 所有密码 / 密钥 / API Key 严禁提交到版本库！
# ==============================

spring:
  datasource:
    # MySQL 数据库 —— 替换为真实地址
    url: jdbc:mysql://localhost:3306/subject?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
    username: root
    password: YOUR_DB_PASSWORD_HERE
    driver-class-name: com.mysql.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

    # Druid 数据源连接池参数（按需调整）
    initialSize: 5
    minIdle: 5
    maxActive: 20
    maxWait: 60000
    timeBetweenEvictionRunsMillis: 60000
    minEvictableIdleTimeMillis: 300000
    validationQuery: SELECT 1 FROM DUAL
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    poolPreparedStatements: true
    filters: stat,wall,log4j
    maxPoolPreparedStatementPerConnectionSize: 20
    useGlobalDataSourceStat: true
    connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500

  servlet:
    multipart:
      max-request-size: 5MB
      max-file-size: 5MB

# ==============================
# 腾讯云 COS 对象存储 —— 替换为真实密钥
# ==============================
cos:
  secretId: YOUR_COS_SECRET_ID_HERE
  secretKey: YOUR_COS_SECRET_KEY_HERE
  region: ap-guangzhou
  bucketName: YOUR_BUCKET_NAME_HERE
  baseUrl: https://YOUR_BUCKET_NAME_HERE.cos.ap-guangzhou.myqcloud.com

# ==============================
# Redis（如需启用，取消注释并填入真实值）
