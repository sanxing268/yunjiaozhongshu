# ==============================
# AI 配置 —— 阿里云 DashScope，替换为真实 API Key
# ==============================
ai:
  dashscope:
    api-key: YOUR_DASHSCOPE_API_KEY_HERE
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen3.6-max-preview
    enable-thinking: true
    thinking-budget: 4000
